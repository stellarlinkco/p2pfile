name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: bun install

      - name: Run lint
        run: just lint

      - name: Run typecheck
        run: just typecheck

      - name: Run unit tests
        run: just test-unit

      - name: Run build
        run: just build

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run e2e smoke
        run: just test-e2e
